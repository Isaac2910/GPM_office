<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pointage App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
  <header class="mb-4 pb-2 border-bottom mb-4 pb-2 border-bottom d-flex justify-content-between align-items-center ">
    <h1>Welcome</h1>
    {% if user.is_authenticated %}
      <p >Connecté comme {{ user.username }} ({{ user.role }}) — <a href="{% url 'authentication:logout' %}">Déconnexion</a></p>
    {% endif %}
    <hr>
  </header>

  <main>
    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
