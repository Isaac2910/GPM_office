{% extends 'base.html'%}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2>Connexion</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-3">
        <label for="id_username">Identifiant</label>
        {{ form.email }}
      </div>
      <div class="mb-3">
        <label for="password">Mot de passe</label>
        {{ form.password }}
      </div>
      <button class="btn btn-primary" type="submit">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
